name: keymaster-mcp
display_name: "AKARI Keymaster"
description: >
  Non-disclosing credential discovery and health checks for HashiCorp Vault via Keymaster.
  MCP responses contain status and metadata, never credential values.
version: "1.0.4"
author: AInoAKARI
repository: https://github.com/AInoAKARI/keymaster-mcp
homepage: https://github.com/AInoAKARI/keymaster-mcp
license: MIT
language: typescript

runtime: node
runtime_version: ">=18.0.0"
install: npm install -g @akari-os/keymaster-mcp
command: keymaster-mcp

credentials_mode: per_user

env:
  - name: USER_KEYMASTER_URL
    description: "Your Keymaster server URL (e.g. https://akari-keymaster.fly.dev)"
    required: true
    input_type: url
  - name: USER_KEYMASTER_TOKEN
    description: "Your Bearer token for Keymaster authentication"
    required: true
    input_type: secret

tools:
  - name: secret_status
    description: "Check credential availability without returning its value"
  - name: healthcheck
    description: "Check Keymaster connectivity and validate all known API keys"
  - name: list_services
    description: "List all known services and their key names"
  - name: list_secrets
    description: "List approved credential paths as metadata only"
  - name: rotate_secret
    description: "Direct rotation to the Fly-authenticated one-time localhost intake"

categories:
  - security
  - developer-tools

tags:
  - secrets
  - vault
  - security
  - api-keys
  - keymaster
  - hashicorp-vault
