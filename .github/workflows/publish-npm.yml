name: Publish Keymaster MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "keymaster-mcp/src/**"
      - "keymaster-mcp/test/**"
      - "keymaster-mcp/scripts/**"
      - "keymaster-mcp/README.md"
      - "keymaster-mcp/SECURITY.md"
      - "keymaster-mcp/CHANGELOG.md"
      - "keymaster-mcp/package.json"
      - "keymaster-mcp/package-lock.json"
      - "keymaster-mcp/server.json"
      - ".github/workflows/publish-npm.yml"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: keymaster-mcp-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: keymaster-mcp
    env:
      PACKAGE_NAME: "@akari-os/keymaster-mcp"
      MCP_NAME: "io.github.ainoakari/keymaster-mcp"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: keymaster-mcp/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm install --global npm@latest

      - name: Resolve and validate release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          package_name="$(node -p "require('./package.json').name")"
          mcp_name="$(node -p "require('./package.json').mcpName")"
          server_version="$(node -p "require('./server.json').version")"
          server_package_version="$(node -p "require('./server.json').packages[0].version")"
          server_name="$(node -p "require('./server.json').name")"
          test "${package_name}" = "${PACKAGE_NAME}"
          test "${mcp_name}" = "${MCP_NAME}"
          test "${server_name}" = "${MCP_NAME}"
          test "${server_version}" = "${version}"
          test "${server_package_version}" = "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release artifacts and CycloneDX SBOM
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm pack --json > pack.json
          tarball="$(jq -r '.[0].filename' pack.json)"
          test -s "${tarball}"
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          test -s sbom.cdx.json
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"

      - name: Attest npm tarball provenance
        uses: actions/attest@v4
        with:
          subject-path: keymaster-mcp/${{ steps.artifacts.outputs.tarball }}

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: keymaster-mcp/sbom.cdx.json

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: keymaster-mcp-${{ steps.meta.outputs.version }}-supply-chain
          path: |
            keymaster-mcp/${{ steps.artifacts.outputs.tarball }}
            keymaster-mcp/sbom.cdx.json
            keymaster-mcp/pack.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish npm package with trusted OIDC when absent
        id: npm_publish
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          if npm view "${PACKAGE_NAME}@${version}" version >/dev/null 2>&1; then
            echo "result=already_public" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          unset NODE_AUTH_TOKEN || true
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then rm -f "${NPM_CONFIG_USERCONFIG}"; fi
          npm publish "${{ steps.artifacts.outputs.tarball }}" --access public --provenance
          echo "result=published" >> "${GITHUB_OUTPUT}"

      - name: Verify npm surface
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          for attempt in $(seq 1 18); do
            public_version="$(npm view "${PACKAGE_NAME}@${version}" version 2>/dev/null || true)"
            if [ "${public_version}" = "${version}" ]; then exit 0; fi
            sleep 5
          done
          echo "npm package did not become publicly observable" >&2
          exit 1

      - name: Install official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Publish immutable metadata to official MCP Registry when absent
        id: registry_publish
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          encoded_name="$(node -e "console.log(encodeURIComponent(process.env.MCP_NAME))")"
          existing="$(curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=${encoded_name}" || true)"
          if jq -e --arg name "${MCP_NAME}" --arg version "${version}" '.servers[]? | select((.server.name // .name) == $name and (.server.version // .version) == $version)' <<<"${existing}" >/dev/null; then
            echo "result=already_public" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "result=published" >> "${GITHUB_OUTPUT}"

      - name: Verify official MCP Registry surface
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          encoded_name="$(node -e "console.log(encodeURIComponent(process.env.MCP_NAME))")"
          for attempt in $(seq 1 18); do
            response="$(curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=${encoded_name}" || true)"
            if jq -e --arg name "${MCP_NAME}" --arg version "${version}" '.servers[]? | select((.server.name // .name) == $name and (.server.version // .version) == $version)' <<<"${response}" >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "MCP Registry metadata did not become publicly observable" >&2
          exit 1

      - name: Return release proof to main
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          mkdir -p distribution
          cat > "distribution/keymaster-mcp-${version}.json" <<EOF
          {
            "package": "${PACKAGE_NAME}",
            "mcpName": "${MCP_NAME}",
            "version": "${version}",
            "npm": "${{ steps.npm_publish.outputs.result }}",
            "mcpRegistry": "${{ steps.registry_publish.outputs.result }}",
            "sbom": "cyclonedx",
            "githubArtifactAttestations": true,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "truthBoundary": "Publication, supply-chain provenance, and public discoverability only; third-party adoption is not claimed."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "distribution/keymaster-mcp-${version}.json"
          git diff --cached --quiet && exit 0
          git commit -m "proof: Keymaster MCP ${version} public"
          git pull --rebase origin main
          git push origin HEAD:main
