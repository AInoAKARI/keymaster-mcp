name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keymaster-mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use npm with trusted-publisher support
        run: npm install --global npm@^11.15.0
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
      - name: Match tag to package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm publish
      - name: Install MCP Registry publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish MCP Registry metadata
        run: ./mcp-publisher publish
