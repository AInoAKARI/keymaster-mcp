version: 2
updates:
  - package-ecosystem: npm
    directory: /keymaster-mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 6
    groups:
      mcp-sdk-v1:
        patterns:
          - "@modelcontextprotocol/*"
      validation-runtime:
        patterns:
          - "zod"
      development-toolchain:
        patterns:
          - "typescript"
          - "@types/node"
          - "ts-node"
    ignore:
      - dependency-name: "zod"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 8
    commit-message:
      prefix: ci
