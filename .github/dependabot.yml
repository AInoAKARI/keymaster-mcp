version: 2
updates:
  - package-ecosystem: npm
    directory: /keymaster-mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      mcp-runtime:
        patterns:
          - "@modelcontextprotocol/*"
          - "zod"
      development-toolchain:
        dependency-type: development
    labels:
      - dependencies
      - security
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: ci
